<html lang="ms">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jom Belajar Arab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
:root{--bg:#eef6f4;--card:#fff;--ink:#12343b;--mute:#5a7a80;--main:#0f7c78;--main-ink:#fff;--sun:#ffc93c;--ok:#1f9d55;--bad:#d64545;--line:#cfe3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2226;--card:#16363b;--ink:#eaf5f3;--mute:#9bbcc0;--main:#3cc6bf;--main-ink:#08262a;--line:#24494f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e2226;--card:#16363b;--ink:#eaf5f3;--mute:#9bbcc0;--main:#3cc6bf;--main-ink:#08262a;--line:#24494f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;font-size:18px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 2px}
p.sub{margin:0 0 12px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 12px}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.on{background:var(--main);color:var(--main-ink);border-color:var(--main)}
.cats button{font-size:16px;padding:4px 10px}
.tabs button{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 14px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro",serif;font-size:68px;line-height:1.4;direction:rtl}
.ar.s{font-size:42px}
.tr{color:var(--mute);font-size:22px}
.ms{font-size:32px;font-weight:700;color:var(--main)}
.hint{color:var(--mute);font-size:15px;margin-top:6px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{padding:12px 8px;font-size:20px}
.opts button.a{font-family:"Noto Naskh Arabic",serif;font-size:28px}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.score{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}
.star{color:var(--sun)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:4px 6px;text-align:center;background:var(--card)}th.g{background:var(--main);color:var(--main-ink)}td.ta{font-family:"Noto Naskh Arabic",serif;font-size:22px;white-space:nowrap}td small{font-family:"Baloo 2",sans-serif;font-size:12px;color:var(--mute)}.wrap{overflow-x:auto;margin-bottom:8px}
.opts button.a.s{font-size:21px;line-height:1.7}label{display:block;margin:8px 0}input[type=range]{width:100%;accent-color:var(--main)}svg.clk{max-width:200px;color:var(--ink)}
.pic{font-size:84px;line-height:1.1;margin:4px 0}.sw{width:84px;height:84px;border-radius:50%;border:4px solid var(--line);margin:4px 0}@media (prefers-reduced-motion:no-preference){.opts button.ok{animation:pop .4s}.pic{animation:pop .5s}@keyframes pop{50%{transform:scale(1.1)}}}
</style>
</head>

function head(){
 $("cats").style.display=(mode==="dhamir"||mode==="jam")?"none":"";$("cats").innerHTML=TOPICS.map(c=>`<button class="${c===cat?"on":""}" onclick="setCat(${TOPICS.indexOf(c)})">${mastered[c]?"⭐ ":""}${ICON[c]||""} ${c}</button>`).join("");

 const n=Object.keys(mastered).length;
 $("prog").textContent=`Tajuk dikuasai: ${n} / ${TOTAL}. Jawab ${GOAL} soalan kuiz betul berturut-turut untuk dapat bintang.`;

function reset(){i=0;flipped=false;score=total=streak=0;q=null;dq=null;jq=null}
function setCat(k){cat=TOPICS[k];reset();render()}
function setMode(m){mode=m;reset();render()}
function render(){head();mode==="kad"?card():mode==="kuiz"?quiz():mode==="jam"?jam():dh()}
function card(){
 const w=DATA[cat][i];
 $("view").innerHTML=`<button class="card" onclick="flip()" aria-label="Pusing kad">${pic(w)}<div class="${sz(w[0])}">${w[0]}</div>
 ${flipped?`<div class="tr">${w[1]}</div><div class="ms">${w[2]}</div>`:`<div class="hint">Ketik untuk lihat maksud</div>`}</button>
 <div class="nav"><button onclick="step(-1)">Sebelum</button><button onclick="say()">Dengar</button><button onclick="step(1)">Seterusnya</button></div>
 <p class="hint" style="text-align:center">${i+1} / ${DATA[cat].length}</p>`;
}
function say(){speak(DATA[cat][i][0])}
function flip(){flipped=!flipped;if(flipped)say();card()}
function step(d){const n=DATA[cat].length;i=(i+d+n)%n;flipped=false;card()}
function quiz(){
 if(!q){
  const w=DATA[cat][Math.floor(Math.random()*DATA[cat].length)];
  const wrong=shuffle(DATA[cat].filter(x=>x!==w)).slice(0,3);
  q={w,rev:Math.random()<.5,opts:shuffle([w,...wrong]),done:false};
 }
 const w=q.w;
 $("view").innerHTML=`<div class="score" id="sc"></div>
 <div class="card" id="qc">${q.rev?`<div class="hint">Pilih perkataan Arab yang betul</div><div class="ms">${w[2]}</div>`:`<div class="hint">Apakah maksud perkataan ini?</div><div class="${sz(w[0])}">${w[0]}</div><div class="tr">${w[1]}</div>`}</div>
 <div class="opts">${q.opts.map((o,k)=>`<button class="${q.rev?"a":""}" id="o${k}" onclick="pick(${k})">${q.rev?o[0]:o[2]}</button>`).join("")}</div><div class="nav" id="nx"></div>`;
 scoreUI();
}
function scoreUI(){$("sc").innerHTML=`<span>Skor: ${score} / ${total}</span><span class="star">Berturut-turut: ${streak} / ${GOAL}</span>`}
function pick(k){
 if(q.done)return;q.done=true;total++;
 const right=q.opts[k]===q.w;
 if(right){score++;streak++}else streak=0;
 q.opts.forEach((o,j)=>{const b=$("o"+j);if(o===q.w)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
 speak(q.w[0]);scoreUI();$("qc").insertAdjacentHTML("beforeend",pic(q.w));
 let msg=right?"Betul! Soalan seterusnya":"Cuba lagi. Soalan seterusnya";
 if(streak>=GOAL&&!mastered[cat]){mastered[cat]=1;try{localStorage.setItem("arab-mastered",JSON.stringify(mastered))}catch(e){}head();msg="⭐ Tahniah! Tajuk dikuasai. Teruskan";}
 $("nx").innerHTML=`<button onclick="next()">${msg}</button>`;
}
function next(){q=null;quiz()}
const DH=[["هُوَ","huwa","dia (lelaki)","بَيْتُهُ","ذَهَبَ","يَذْهَبُ"],["هُمَا","humā","mereka berdua (lelaki)","بَيْتُهُمَا","ذَهَبَا","يَذْهَبَانِ"],["هُمْ","hum","mereka (lelaki)","بَيْتُهُمْ","ذَهَبُوا","يَذْهَبُونَ"],["هِيَ","hiya","dia (perempuan)","بَيْتُهَا","ذَهَبَتْ","تَذْهَبُ"],["هُمَا","humā","mereka berdua (perempuan)","بَيْتُهُمَا","ذَهَبَتَا","تَذْهَبَانِ"],["هُنَّ","hunna","mereka (perempuan)","بَيْتُهُنَّ","ذَهَبْنَ","يَذْهَبْنَ"],["أَنْتَ","anta","awak (lelaki)","بَيْتُكَ","ذَهَبْتَ","تَذْهَبُ"],["أَنْتُمَا","antumā","kamu berdua (lelaki)","بَيْتُكُمَا","ذَهَبْتُمَا","تَذْهَبَانِ"],["أَنْتُمْ","antum","kamu semua (lelaki)","بَيْتُكُمْ","ذَهَبْتُمْ","تَذْهَبُونَ"],["أَنْتِ","anti","awak (perempuan)","بَيْتُكِ","ذَهَبْتِ","تَذْهَبِينَ"],["أَنْتُمَا","antumā","kamu berdua (perempuan)","بَيْتُكُمَا","ذَهَبْتُمَا","تَذْهَبَانِ"],["أَنْتُنَّ","antunna","kamu semua (perempuan)","بَيْتُكُنَّ","ذَهَبْتُنَّ","تَذْهَبْنَ"],["أَنَا","anā","saya","بَيْتِي","ذَهَبْتُ","أَذْهَبُ"],["نَحْنُ","naḥnu","kami / kita","بَيْتُنَا","ذَهَبْنَا","نَذْهَبُ"]];
const GR={0:"Ghaib (orang ketiga)",6:"Mukhatab (orang kedua)",12:"Mutakallim (orang pertama)"};
let dsub="jadual",dq=null;
function dh(){$("view").innerHTML=`<div class="row tabs">${[["jadual","Jadual"],["latihan","Latihan"]].map(s=>`<button class="${s[0]===dsub?"on":""}" onclick="dsetSub('${s[0]}')">${s[1]}</button>`).join("")}</div><div id="dv"></div>`;dsub==="jadual"?dtab():dquiz()}
function dsetSub(s){dsub=s;reset();dh()}
function dtab(){
 $("dv").innerHTML=`<p class="hint">Ketik ganti nama untuk mendengar sebutannya. Cuba Latihan selepas hafal.</p><div class="wrap"><table><tr>${["Ganti nama","Maksud","بَيْت (rumah)","ذَهَبَ (telah)","يَذْهَبُ (sedang)"].map(h=>`<th class="g">${h}</th>`).join("")}</tr>${DH.map((r,k)=>(GR[k]?`<tr><th class="g" colspan="5">${GR[k]}</th></tr>`:"")+`<tr><td class="ta" onclick="speak('${r[0]}')">${r[0]}<br><small>${r[1]}</small></td><td>${ICN[k]}<br>${r[2]}</td><td class="ta">${r[3]}</td><td class="ta">${r[4]}</td><td class="ta">${r[5]}</td></tr>`).join("")}</table></div>`;
}
function dquiz(){
 if(!dq){
  const key=[0,3,4,5][Math.floor(Math.random()*4)],r=DH[Math.floor(Math.random()*DH.length)];
  const pool=[...new Set(DH.map(x=>x[key]))].filter(x=>x!==r[key]);
  dq={r,key,opts:shuffle([r[key],...shuffle(pool).slice(0,3)]),done:false};
 }
 const r=dq.r,t={0:"Pilih ganti nama Arab bagi:",3:"Pilih bentuk betul bagi: rumah",4:"Pilih bentuk betul bagi: telah pergi (ذَهَبَ)",5:"Pilih bentuk betul bagi: sedang pergi (يَذْهَبُ)"}[dq.key];
 $("dv").innerHTML=`<div class="score" id="sc"></div><div class="card"><div class="hint">${t}</div><div class="pic">${ICN[DH.indexOf(r)]}</div><div class="ms">${r[2]}</div></div><div class="opts">${dq.opts.map((o,k)=>`<button class="a" id="o${k}" onclick="dpick(${k})">${o}</button>`).join("")}</div><div class="nav" id="nx"></div>`;
 scoreUI();
}
function dpick(k){
 if(dq.done)return;dq.done=true;total++;
 const right=dq.opts[k]===dq.r[dq.key];
 if(right){score++;streak++}else streak=0;
 dq.opts.forEach((o,j)=>{const b=$("o"+j);if(o===dq.r[dq.key])b.classList.add("ok");else if(j===k)b.classList.add("bad")});
 speak(dq.r[dq.key]);scoreUI();
 let msg=right?"Betul! Soalan seterusnya":"Cuba lagi. Soalan seterusnya";
 if(streak>=GOAL&&!mastered.Dhamir){mastered.Dhamir=1;try{localStorage.setItem("arab-mastered",JSON.stringify(mastered))}catch(e){}head();msg="⭐ Tahniah! Dhamir dikuasai. Teruskan"}
 $("nx").innerHTML=`<button onclick="dq=null;dquiz()">${msg}</button>`;
}
const HN=["","الْوَاحِدَةُ","الثَّانِيَةُ","الثَّالِثَةُ","الرَّابِعَةُ","الْخَامِسَةُ","السَّادِسَةُ","السَّابِعَةُ","الثَّامِنَةُ","التَّاسِعَةُ","الْعَاشِرَةُ","الْحَادِيَةَ عَشْرَةَ","الثَّانِيَةَ عَشْرَةَ"];
const PL={0:" تَمَامًا",5:" وَخَمْسُ دَقَائِقَ",10:" وَعَشْرُ دَقَائِقَ",15:" وَالرُّبْعُ",20:" وَالثُّلُثُ",25:" وَخَمْسٌ وَعِشْرُونَ دَقِيقَةً",30:" وَالنِّصْفُ"};
const MN={35:" إِلَّا خَمْسًا وَعِشْرِينَ دَقِيقَةً",40:" إِلَّا الثُّلُثَ",45:" إِلَّا الرُّبْعَ",50:" إِلَّا عَشْرَ دَقَائِقَ",55:" إِلَّا خَمْسَ دَقَائِقَ"};
const ph=(h,m)=>"السَّاعَةُ "+HN[m>30?h%12+1:h]+(m>30?MN[m]:PL[m]);
const tm=(h,m)=>h+":"+String(m).padStart(2,"0");
const rnd=n=>Math.floor(Math.random()*n);
let jsub="belajar",jh=3,jm=20,jq=null;
function clock(h,m){
 const p=(a,L)=>`${100+L*Math.sin(a*Math.PI/180)}`,y=(a,L)=>`${100-L*Math.cos(a*Math.PI/180)}`,ha=(h%12)*30+m/2,ma=m*6;
 let s=`<svg class="clk" viewBox="0 0 200 200" width="200" role="img" aria-label="Jam ${tm(h,m)}"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="4"/>`;
 for(let n=1;n<=12;n++)s+=`<text x="${p(n*30,74)}" y="${+y(n*30,74)+6}" text-anchor="middle" font-size="18" fill="currentColor">${n}</text>`;
 s+=`<line x1="100" y1="100" x2="${p(ha,46)}" y2="${y(ha,46)}" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="${p(ma,68)}" y2="${y(ma,68)}" stroke="var(--main)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="currentColor"/></svg>`;
 return s;
}
function jam(){$("view").innerHTML=`<div class="row tabs">${[["belajar","Belajar"],["latihan","Latihan"]].map(s=>`<button class="${s[0]===jsub?"on":""}" onclick="jsetSub('${s[0]}')">${s[1]}</button>`).join("")}</div><div id="jv"></div>`;jsub==="belajar"?jlearn():jquiz()}
function jsetSub(s){jsub=s;reset();jam()}
function jlearn(){
 const P=[0,5,10,15,20,25,30],M=[35,40,45,50,55];
 $("jv").innerHTML=`<p class="hint">Gerakkan peluncur untuk menukar masa dan lihat cara menyebutnya.</p><div class="card" id="jc"></div>
 <label>Jam<input type="range" id="rh" min="1" max="12" value="${jh}" oninput="jupd()"></label>
 <label>Minit<input type="range" id="rm" min="0" max="55" step="5" value="${jm}" oninput="jupd()"></label>
 <div class="nav"><button onclick="speak(ph(jh,jm))">Dengar</button></div>
 <div class="wrap"><table><tr><th class="g">Jam</th><th class="g">Minit (+)</th><th class="g">Minit (−)</th></tr>${HN.slice(1).map((n,k)=>`<tr><td class="ta">${k+1}:00<br>${n}</td><td class="ta">${k<7?P[k]+"<br>"+PL[P[k]]:""}</td><td class="ta">${k<5?M[k]+"<br>"+MN[M[k]]:""}</td></tr>`).join("")}</table></div>`;
 jupd();
}
function jupd(){
 jh=+$("rh").value;jm=+$("rm").value;
 const r=jm===0?"Tepat: sebut jam, kemudian تَمَامًا.":jm<=30?"Zon selamat (minit 1–30): sebut jam semasa, kemudian و + minit.":"Zon bahaya (minit 31–59): tambah 1 jam, kemudian إِلَّا + minit yang tinggal.";
 $("jc").innerHTML=`${clock(jh,jm)}<div class="ms">${tm(jh,jm)}</div><div class="ar s">${ph(jh,jm)}</div><div class="hint">${r}</div>`;
}
function jquiz(){
 if(!jq){
  const h=1+rnd(12),m=5*rnd(12),t=rnd(3),L=t===2,correct=L?tm(h,m):ph(h,m);
  const pool=L?[tm(h%12+1,m),tm(h,(m+30)%60),tm((h+10)%12+1,m),tm(h%12+1,(m+30)%60),tm(h,(m+5)%60)]:["السَّاعَةُ "+HN[h]+(m>30?MN[m]:PL[m]),ph(h%12+1,m),ph(h,(m+35)%60),ph(h,(m+20)%60),ph(h%12+1,(m+10)%60)];
  const set=new Set();
  for(const c of pool)if(c!==correct&&set.size<3)set.add(c);
  while(set.size<3){const x=L?tm(1+rnd(12),5*rnd(12)):ph(1+rnd(12),5*rnd(12));if(x!==correct)set.add(x)}
  jq={h,m,t,correct,opts:shuffle([correct,...set]),done:false};
 }
 const{h,m,t}=jq,body=t===0?`<div class="hint">Bagaimana menyebut masa pada jam ini?</div>${clock(h,m)}`:t===1?`<div class="hint">Bagaimana menyebut masa ini dalam bahasa Arab?</div><div class="ms">${tm(h,m)}</div>`:`<div class="hint">Apakah masa ini?</div><div class="ar s">${ph(h,m)}</div>`;
 $("jv").innerHTML=`<div class="score" id="sc"></div><div class="card">${body}</div><div class="opts">${jq.opts.map((o,k)=>`<button class="${t===2?"":"a s"}" id="o${k}" onclick="jpick(${k})">${o}</button>`).join("")}</div><div class="nav" id="nx"></div>`;
 scoreUI();
}
function jpick(k){
 if(jq.done)return;jq.done=true;total++;
 const right=jq.opts[k]===jq.correct;
 if(right){score++;streak++}else streak=0;
 jq.opts.forEach((o,j)=>{const b=$("o"+j);if(o===jq.correct)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
 speak(ph(jq.h,jq.m));scoreUI();
 let msg=right?"Betul! Soalan seterusnya":"Cuba lagi. Soalan seterusnya";
 if(streak>=GOAL&&!mastered.Jam){mastered.Jam=1;try{localStorage.setItem("arab-mastered",JSON.stringify(mastered))}catch(e){}head();msg="⭐ Tahniah! Jam dikuasai. Teruskan"}
 $("nx").innerHTML=`<button onclick="jq=null;jquiz()">${msg}</button>`;
}
render();
</script>
</body>
